apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ehr-platform

resources:
  - ../../base

# Scale down replicas in dev to save resources
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=ehr-platform

# Dev-specific config overrides
configMapGenerator:
  - name: ehr-common-config
    behavior: merge
    literals:
      - ASPNETCORE_ENVIRONMENT=Development
      - Logging__LogLevel__Default=Debug

# Disable HPA in dev (fixed replicas)
patches:
  - patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: "*"
    target:
      kind: HorizontalPodAutoscaler

images:
  - name: ehr/api-gateway
    newTag: dev
  - name: ehr/identity-service
    newTag: dev
  - name: ehr/patient-service
    newTag: dev
  - name: ehr/clinical-service
    newTag: dev
  - name: ehr/appointment-service
    newTag: dev
  - name: ehr/notification-service
    newTag: dev
  - name: ehr/audit-service
    newTag: dev
  - name: ehr/billing-service
    newTag: dev
  - name: ehr/prescription-service
    newTag: dev
  - name: ehr/analytics-service
    newTag: dev
  - name: ehr/frontend
    newTag: dev
