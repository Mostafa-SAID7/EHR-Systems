# =============================================================================
# RBAC — least-privilege service account for EHR pods
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ehr-service-account
  namespace: ehr-platform
  labels:
    app.kubernetes.io/part-of: ehr-platform
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ehr-service-role
  namespace: ehr-platform
rules:
  # Allow pods to read their own ConfigMaps and Secrets
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ehr-service-rolebinding
  namespace: ehr-platform
subjects:
  - kind: ServiceAccount
    name: ehr-service-account
    namespace: ehr-platform
roleRef:
  kind: Role
  name: ehr-service-role
  apiGroup: rbac.authorization.k8s.io
