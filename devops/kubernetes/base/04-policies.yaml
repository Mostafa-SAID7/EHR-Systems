---
# Resource Quota for namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  namespace: ehr-platform
  name: ehr-quota
spec:
  hard:
    requests.cpu: "100"
    requests.memory: "200Gi"
    limits.cpu: "200"
    limits.memory: "400Gi"
    pods: "200"
    persistentvolumeclaims: "50"
    services: "50"
    ingresses: "10"

---
# Network Policy: Deny all by default
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: ehr-platform
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress

---
# Network Policy: Allow services to communicate within namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: ehr-platform
  name: allow-intra-namespace
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ehr-platform
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: ehr-platform
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53  # DNS
    - protocol: UDP
      port: 53  # DNS

---
# Pod Security Policy (deprecated in K8s 1.25+, use Pod Security Standards)
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: ehr-restricted
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsUser:
    rule: 'MustRunAsNonRoot'
  seLinux:
    rule: 'MustRunAs'
    seLinuxOptions:
      level: "s0:c123,c456"
  fsGroup:
    rule: 'MustRunAs'
    fsGroupOptions:
      ranges:
        - min: 1000
          max: 65535
  readOnlyRootFilesystem: false

---
# Pod Disruption Budget: Ensure availability during updates
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  namespace: ehr-platform
  name: api-gateway-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api-gateway

---
# Pod Disruption Budget: Services
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  namespace: ehr-platform
  name: services-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: ehr-platform
      component: service
