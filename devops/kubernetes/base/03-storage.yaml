---
# Storage Class for databases (fast, SSD-backed)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ehr-fast-storage
provisioner: kubernetes.io/aws-ebs  # Change based on your cloud provider
parameters:
  type: gp3  # AWS: general purpose SSD
  iops: "3000"
  throughput: "125"
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer

---
# Storage Class for caching and temporary data
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ehr-standard-storage
provisioner: kubernetes.io/aws-ebs
parameters:
  type: gp3
  iops: "1000"
  throughput: "125"
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer

---
# Storage Class for logs and traces (cost-optimized)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ehr-archive-storage
provisioner: kubernetes.io/aws-ebs
parameters:
  type: sc1  # AWS: cold HDD
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer

---
# PostgreSQL Identity - Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: ehr-platform
  name: postgresql-identity-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ehr-fast-storage
  resources:
    requests:
      storage: 20Gi

