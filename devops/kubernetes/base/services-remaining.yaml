# =============================================================================
# Clinical, Appointment, Notification, Audit, Billing, Prescription, Analytics
# Each follows the same pattern: Deployment + Service + PodDisruptionBudget
# =============================================================================

---
# ── Clinical Service ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinical-service
  namespace: ehr-platform
  labels:
    app: clinical-service
    app.kubernetes.io/part-of: ehr-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clinical-service
  template:
    metadata:
      labels:
        app: clinical-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: ehr-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: clinical-service
          image: ehr/clinical-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: ehr-common-config
            - secretRef:
                name: ehr-secrets
          env:
            - name: PGHOST
              value: postgres-clinical
            - name: PGDATABASE
              value: ehr_clinical
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ehr-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "600m"
              memory: "512Mi"
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: clinical-service
  namespace: ehr-platform
spec:
  selector:
    app: clinical-service
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clinical-service-pdb
  namespace: ehr-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: clinical-service

