---
# NOTE: In production, use:
# - External Secrets Operator (AWS Secrets Manager, Azure Key Vault, etc.)
# - Sealed Secrets
# - Vault
# - HashiCorp Vault integration
# DO NOT commit actual secrets to Git

apiVersion: v1
kind: Secret
metadata:
  namespace: ehr-platform
  name: ehr-database-credentials
type: Opaque
stringData:
  # PostgreSQL
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # MongoDB
  MONGO_USER: "ehr_admin"
  MONGO_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # MySQL
  MYSQL_USER: "ehr_billing_user"
  MYSQL_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  MYSQL_ROOT_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

---
apiVersion: v1
kind: Secret
metadata:
  namespace: ehr-platform
  name: ehr-broker-credentials
type: Opaque
stringData:
  # RabbitMQ
  RABBITMQ_USER: "ehr_user"
  RABBITMQ_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # Redis
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

---
apiVersion: v1
kind: Secret
metadata:
  namespace: ehr-platform
  name: ehr-auth-secrets
type: Opaque
stringData:
  # JWT Secret
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION_USE_VERY_LONG_SECURE_KEY"

---
apiVersion: v1
kind: Secret
metadata:
  namespace: ehr-platform
  name: ehr-monitoring-credentials
type: Opaque
stringData:
  # Grafana
  GRAFANA_ADMIN_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # RabbitMQ Management
  RABBITMQ_MANAGEMENT_USER: "admin"
  RABBITMQ_MANAGEMENT_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

---
apiVersion: v1
kind: Secret
metadata:
  namespace: ehr-platform
  name: ehr-registry-credentials
type: docker.io/dockercfg
stringData:
  .dockercfg: |
    {
      "docker.io": {
        "auth": "BASE64_ENCODED_USERNAME_PASSWORD",
        "email": "your-email@example.com"
      }
    }
