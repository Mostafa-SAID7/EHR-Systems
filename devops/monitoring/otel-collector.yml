# =============================================================================
# OpenTelemetry Collector Configuration — EHR Platform
# Receives traces from all microservices and exports to Jaeger + Prometheus
# =============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

  # Pull Prometheus metrics from services that expose them
  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector-self
          static_configs:
            - targets: ["localhost:8888"]

processors:
  # Batch spans before forwarding (reduces network overhead)
  batch:
    timeout: 10s
    send_batch_size: 1024

  # Add resource attributes for HIPAA correlation
  resource:
    attributes:
      - key: deployment.environment
        value: "${ENVIRONMENT:-development}"
        action: insert
      - key: service.namespace
        value: ehr-platform
        action: insert

  # Memory limiter prevents OOM
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

  # Redact PHI from span attributes (HIPAA)
  attributes:
    actions:
      - key: patient.ssn
        action: delete
      - key: patient.dob
        action: delete
      - key: http.request.body
        action: delete

exporters:
  # Distributed tracing → Tempo (replaces Jaeger)
  otlp/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true

  # Metrics → Prometheus (push via remote_write or scrape via Prometheus receiver)
  prometheusremotewrite:
    endpoint: "http://prometheus:9090/api/v1/write"
    resource_to_telemetry_conversion:
      enabled: true

  # Logs → Loki (via JSON exporter)
  logging/loki:
    loglevel: debug

  # Fallback logging for debugging
  logging:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers:  [otlp]
      processors: [memory_limiter, resource, attributes, batch]
      exporters:  [otlp/tempo, logging]

    metrics:
      receivers:  [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters:  [prometheusremotewrite, logging]

    logs:
      receivers:  [otlp]
      processors: [memory_limiter, resource, batch]
      exporters:  [logging/loki, logging]
