# =============================================================================
# OpenTelemetry Collector Configuration — EHR Platform
# Vendor-Neutral Architecture: Receives OTLP from services, exports to any backend
# =============================================================================

receivers:
  # OTLP (OpenTelemetry Protocol) — Vendor-neutral telemetry ingestion
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  # Batch processor: Reduces network calls, improves throughput
  batch:
    timeout: 10s
    send_batch_size: 1024

  # Memory limiter: Prevents OOM
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

  # Resource processor: Add resource attributes for correlation
  resource:
    attributes:
      - key: deployment.environment
        value: "${ENVIRONMENT:-development}"
        action: insert
      - key: service.namespace
        value: ehr-platform
        action: insert

  # Attributes processor: Remove/redact PHI (patient IDs, emails, etc.)
  # SECURITY: Ensures compliance with HIPAA
  attributes:
    actions:
      # Remove PII from span attributes
      - key: db.statement
        action: delete  # Don't log SQL queries (may contain PII)
      - key: http.request.body
        action: delete  # Don't log request bodies
      - key: http.response.body
        action: delete  # Don't log response bodies
      - key: patient_id
        action: delete
      - key: user_id
        action: delete
      - key: email
        action: delete
      - key: phone
        action: delete
      - key: ssn
        action: delete

exporters:
  # Prometheus: Metrics backend via remote_write
  # Vendor-neutral metrics storage (can be swapped for Datadog, New Relic, etc.)
  prometheusremotewrite:
    endpoint: "http://prometheus:9090/api/v1/write"
    resource_to_telemetry_conversion:
      enabled: true  # Add resource attrs as metric labels

  # Tempo: Distributed tracing backend via OTLP
  # Vendor-neutral trace storage (can be swapped for Datadog APM, Jaeger, etc.)
  otlp/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true

  # Loki: Logs backend
  # Vendor-neutral log storage (can be swapped for Splunk, ELK, etc.)
  loki:
    endpoint: "http://loki:3100/loki/api/v1/push"
    format: json

  # Logging exporter: Console output for debugging (optional)
  logging:
    verbosity: debug

service:
  pipelines:
    # Metrics pipeline: Collect from services → Export to Prometheus
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resource
        - batch
      exporters:
        - prometheusremotewrite
        - logging

    # Traces pipeline: Collect from services → Export to Tempo
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resource
        - attributes
        - batch
      exporters:
        - otlp/tempo
        - logging

    # Logs pipeline: Collect from services → Export to Loki
    logs:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resource
        - attributes
        - batch
      exporters:
        - loki
        - logging
