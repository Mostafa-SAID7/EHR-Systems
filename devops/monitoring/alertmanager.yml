# =============================================================================
# Alertmanager Configuration — EHR Platform
# Routes critical EHR alerts to PagerDuty + Slack
# =============================================================================

global:
  resolve_timeout: 5m
  slack_api_url: "$SLACK_WEBHOOK_URL"
  pagerduty_url: "https://events.pagerduty.com/v2/enqueue"

templates:
  - "/etc/alertmanager/templates/*.tmpl"

route:
  group_by: ["alertname", "service", "environment"]
  group_wait:      30s
  group_interval:  5m
  repeat_interval: 4h
  receiver: slack-default

  routes:
    # Critical EHR alerts → PagerDuty (24/7 on-call)
    - matchers:
        - severity="critical"
      receiver: pagerduty-critical
      continue: true   # also send to Slack

    # HIPAA audit failures → dedicated channel
    - matchers:
        - alertname=~"AuditLog.*"
      receiver: slack-hipaa-audit

    # Database alerts
    - matchers:
        - alertname=~"Postgres.*|Redis.*"
      receiver: slack-infra

receivers:
  - name: slack-default
    slack_configs:
      - channel: "#ehr-alerts"
        title: "{{ .GroupLabels.alertname }}"
        text: >-
          *Environment:* {{ .GroupLabels.environment }}
          *Service:* {{ .GroupLabels.service }}
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key: "$PAGERDUTY_ROUTING_KEY"
        description: "{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}"
        severity: critical
        send_resolved: true

  - name: slack-hipaa-audit
    slack_configs:
      - channel: "#ehr-compliance"
        title: "⚠️ HIPAA Audit Alert: {{ .GroupLabels.alertname }}"
        send_resolved: true

  - name: slack-infra
    slack_configs:
      - channel: "#ehr-infra"
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["alertname", "service"]
