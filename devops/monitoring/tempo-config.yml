# =============================================================================
# Tempo Configuration — EHR Platform Distributed Tracing Backend
# Receives OTLP traces from OpenTelemetry Collector
# Provides trace storage and query interface for Grafana
# =============================================================================

server:
  http_listen_port: 3200
  log_level: info

distributor:
  rate_limit_bytes: 10485760  # 10MB
  ring:
    kvstore:
      store: inmemory

ingester:
  trace_idle_period: 10s
  max_block_duration: 5m
  lifecycler:
    ring:
      replication_factor: 1
      kvstore:
        store: inmemory

# OTLP receivers for traces from services
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

# Storage: single node file-based storage for development
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Search configuration for Grafana integration
search_enabled: true

# Metrics generation for RED signals (optional)
metrics_generator:
  enabled: false

# Attributes for service discovery
override_ring_key: ""
