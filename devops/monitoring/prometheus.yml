# =============================================================================
# Prometheus Configuration — EHR Platform
# Used for local development (Docker Compose --profile monitoring)
# In Kubernetes, this is managed by the kube-prometheus-stack Helm chart.
# =============================================================================

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: ehr-local
    environment: development

rule_files:
  - "alert-rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:

  # ── Prometheus self-monitoring ─────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ── EHR Microservices ─────────────────────────────────────────────────────
  - job_name: ehr-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:8080
          - identity-service:8080
          - patient-service:8080
          - clinical-service:8080
          - appointment-service:8080
          - notification-service:8080
          - audit-service:8080
          - billing-service:8080
          - prescription-service:8080
          - analytics-service:8080
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: service
        replacement: "$1"

  # ── PostgreSQL (postgres_exporter) ────────────────────────────────────────
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # ── Redis (redis_exporter) ────────────────────────────────────────────────
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # ── Kafka (kafka_exporter) ────────────────────────────────────────────────
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # ── Node exporter (host metrics) ─────────────────────────────────────────
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
