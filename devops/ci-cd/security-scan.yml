# =============================================================================
# Scheduled Security & Compliance Scan
# Runs daily at 02:00 UTC and on every PR.
# =============================================================================
name: Security Scan

on:
  schedule:
    - cron: "0 2 * * *"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "devops/**"

jobs:
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy (CRITICAL + HIGH)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH

      - uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: trivy-fs.sarif

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      matrix:
        language: [csharp, javascript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v2
      - uses: github/codeql-action/analyze@v2

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v3
        with:
          fail-on-severity: high

  hipaa-compliance-check:
    name: HIPAA Compliance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are not hardcoded
        run: |
          # Fail if real secrets are found in source (basic check)
          if grep -rE "(password|secret|api_key)\s*=\s*['\"][^$\{]" \
               --include="*.cs" --include="*.ts" --include="*.json" \
               --exclude-dir={node_modules,.git,dist} .; then
            echo "❌ Hardcoded secret found — fix before merging"
            exit 1
          fi
          echo "✅ No hardcoded secrets found"

      - name: Check Dockerfiles use non-root users
        run: |
          for f in $(find devops/docker -name "Dockerfile*"); do
            if ! grep -q "USER " "$f"; then
              echo "❌ $f is missing a USER directive (non-root required)"
              exit 1
            fi
          done
          echo "✅ All Dockerfiles run as non-root"

      - name: Check TLS is enforced in k8s ingress
        run: |
          if ! grep -q "ssl-redirect.*true" devops/kubernetes/base/ingress.yaml; then
            echo "❌ TLS redirect not enforced in ingress"
            exit 1
          fi
          echo "✅ TLS redirect enforced"
