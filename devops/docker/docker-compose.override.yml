# =============================================================================
# Development Overrides
# =============================================================================
# Automatically loaded by Docker Compose alongside docker-compose.yml.
# Enables hot-reload volume mounts, debug-friendly log levels, and extra
# developer tooling without touching the base file.
# =============================================================================

version: '3.8'

services:

  identity-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Debug
    volumes:
      - ../../backend/src/EHRPlatform.Services.Identity:/app/hot:ro

  patient-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Debug
    volumes:
      - ../../backend/src/EHRPlatform.Services.Patient:/app/hot:ro

  clinical-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Debug

  appointment-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Debug

  notification-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Debug

  audit-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Debug

  billing-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Debug

  prescription-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Debug

  analytics-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Debug

  api-gateway:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Debug

  # Mailpit — local SMTP trap so emails don't leave dev
  mailpit:
    image: axllent/mailpit:latest
    container_name: ehr-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI → http://localhost:8025
    networks:
      - ehr-network
