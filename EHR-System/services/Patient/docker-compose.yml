version: '3.8'

services:
  patient-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "P@ssw0rd123!"
      ACCEPT_EULA: "Y"
    ports:
      - "1434:1433"
    volumes:
      - patient-db:/var/opt/mssql

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis:/data

  patient-api:
    build: .
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=patient-db;Database=EHRPatient;User Id=sa;Password=P@ssw0rd123!;Encrypt=false;"
      ConnectionStrings__Redis: "redis:6379"
      Elasticsearch__Uri: "http://elasticsearch:9200"
    depends_on:
      - patient-db
      - elasticsearch
      - redis

volumes:
  patient-db:
  elasticsearch:
  redis:
