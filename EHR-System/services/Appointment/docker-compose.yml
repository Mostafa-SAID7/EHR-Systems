version: '3.8'

services:
  appointment-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "P@ssw0rd123!"
      ACCEPT_EULA: "Y"
    ports:
      - "1436:1433"
    volumes:
      - appointment-db:/var/opt/mssql

  appointment-api:
    build: .
    ports:
      - "5006:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=appointment-db;Database=EHRAppointment;User Id=sa;Password=P@ssw0rd123!;Encrypt=false;"
      ASPNETCORE_URLS: "http://+:8080"
    depends_on:
      - appointment-db

volumes:
  appointment-db:
