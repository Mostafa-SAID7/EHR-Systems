# Logstash Configuration for EHR Platform
# Processes logs from all microservices and infrastructure components

input {
  # Filebeat input (structured logs from services)
  beats {
    port => 5044
    codec => json
    ssl => true
    ssl_certificate_authorities => ["/etc/logstash/certs/ca.crt"]
    ssl_certificate => "/etc/logstash/certs/server.crt"
    ssl_key => "/etc/logstash/certs/server.key"
  }

  # Syslog input (system and infrastructure logs)
  syslog {
    port => 514
    codec => plain
    type => "syslog"
    tags => ["infrastructure"]
  }

  # HTTP input (direct log submission)
  http {
    port => 8080
    codec => json
    type => "http"
    path => "/logs"
  }

  # Kafka input (event stream from services)
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["logs-app", "logs-errors", "logs-audit"]
    codec => json
    consumer_threads => 4
    group_id => "logstash-group"
  }
}

filter {
  # Metadata enrichment
  if [type] == "service" {
    # Parse service name from source
    mutate {
      add_field => { "[@metadata][index_type]" => "service-logs" }
    }
  } else if [type] == "syslog" {
    mutate {
      add_field => { "[@metadata][index_type]" => "infra-logs" }
    }
  }

  # JSON parsing for structured logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  }

  # Grok parsing for unstructured logs
  if [type] == "syslog" {
    grok {
      match => {
        "message" => "%{SYSLOGLINE}"
      }
      overwrite => ["host", "timestamp"]
    }
  }

  # Parse application logs (ASP.NET Core format)
  if [message] =~ /\[.*\].*\[.*\]/ {
    grok {
      match => {
        "message" => "\[%{TIMESTAMP_ISO8601:log_timestamp}\] \[%{LOGLEVEL:log_level}\] \[%{DATA:logger_name}\] %{GREEDYDATA:log_message}"
      }
    }
  }

  # Add geographic information (if IP present)
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }

  # Date parsing - standardize timestamp
  date {
    match => [
      "log_timestamp", "ISO8601",
      "timestamp", "dd/MMM/yyyy:HH:mm:ss Z",
      "@timestamp", "ISO8601"
    ]
    target => "@timestamp"
    timezone => "UTC"
  }

  # Extract service name from logger_name
  if [logger_name] {
    mutate {
      gsub => ["logger_name", "^EHRPlatform\.Services\.(\w+)\..*", "\1"]
      add_field => { "service" => "%{logger_name}" }
    }
  }

  # Extract trace_id for correlation
  if [trace_id] {
    mutate {
      add_field => { "[@metadata][trace_id]" => "%{trace_id}" }
    }
  } else if [TraceId] {
    mutate {
      add_field => { "[@metadata][trace_id]" => "%{TraceId}" }
      add_field => { "trace_id" => "%{TraceId}" }
    }
  }

  # Parse HTTP request information
  if [http_method] and [http_path] {
    mutate {
      add_field => {
        "http_request" => "%{http_method} %{http_path}"
      }
    }
  }

  # Error level classification
  if [log_level] =~ /ERROR|CRITICAL|FATAL/ {
    mutate {
      add_field => { "alert_level" => "high" }
      add_tag => ["error"]
    }
  } else if [log_level] =~ /WARN/ {
    mutate {
      add_field => { "alert_level" => "medium" }
      add_tag => ["warning"]
    }
  } else {
    mutate {
      add_field => { "alert_level" => "low" }
    }
  }

  # Add environment information
  mutate {
    add_field => {
      "environment" => "${ENVIRONMENT:development}"
      "region" => "${AWS_REGION:us-east-1}"
      "cluster" => "${CLUSTER_NAME:local}"
    }
  }

  # Add correlationId if present
  if [correlation_id] {
    mutate {
      add_field => { "[@metadata][correlation_id]" => "%{correlation_id}" }
    }
  }

  # Remove unnecessary fields to reduce storage
  mutate {
    remove_field => [
      "host",
      "@version",
      "offset",
      "[prospector]",
      "[beat][hostname]",
      "[beat][name]",
      "[beat][version]"
    ]
  }

  # Sanitize PII (Patient Health Information)
  mutate {
    gsub => [
      "message", "(\b\d{3}[-.\s]?\d{3}[-.\s]?\d{4}\b)", "***PHONE***",
      "message", "(\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b)", "***EMAIL***",
      "message", "(\b\d{3}-\d{2}-\d{4}\b)", "***SSN***"
    ]
  }

  # Lookup service information
  if [service] {
    translate {
      dictionary_path => "/etc/logstash/service-codes.yaml"
      field => "service"
      destination => "service_info"
      override => true
    }
  }

  # Performance metrics extraction
  if [duration_ms] {
    mutate {
      convert => { "duration_ms" => "float" }
    }
    if [duration_ms] > 1000 {
      mutate {
        add_tag => ["slow-query"]
      }
    }
  }

  # Response status classification
  if [response_status] {
    if [response_status] >= 500 {
      mutate {
        add_tag => ["server-error"]
        add_field => { "error_category" => "server_error" }
      }
    } else if [response_status] >= 400 {
      mutate {
        add_tag => ["client-error"]
        add_field => { "error_category" => "client_error" }
      }
    } else if [response_status] >= 300 {
      mutate {
        add_field => { "response_category" => "redirect" }
      }
    } else {
      mutate {
        add_field => { "response_category" => "success" }
      }
    }
  }

  # Database query analysis
  if [query] {
    if [query] =~ /SELECT/ {
      mutate {
        add_field => { "query_type" => "read" }
      }
    } else if [query] =~ /INSERT|UPDATE|DELETE/ {
      mutate {
        add_field => { "query_type" => "write" }
      }
    }
  }

  # API endpoint categorization
  if [http_path] {
    if [http_path] =~ /^\/api\/v\d+\/patients/ {
      mutate {
        add_field => { "api_resource" => "patient" }
      }
    } else if [http_path] =~ /^\/api\/v\d+\/appointments/ {
      mutate {
        add_field => { "api_resource" => "appointment" }
      }
    } else if [http_path] =~ /^\/api\/v\d+\/clinical/ {
      mutate {
        add_field => { "api_resource" => "clinical" }
      }
    }
  }

  # Audit log tagging
  if [event_type] =~ /LOGIN|LOGOUT|ACCESS|PERMISSION|DELETE|MODIFY/ {
    mutate {
      add_tag => ["audit"]
    }
  }
}

output {
  # Elasticsearch output (primary)
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    
    # Dynamic index naming
    index => "logs-%{[service]}-%{+YYYY.MM.dd}"
    document_id => "%{[@metadata][trace_id]}"
    
    # Template management
    template_name => "ehr-logs-template"
    template => "/etc/logstash/templates/logs-template.json"
    template_overwrite => false
    
    # Retry policy
    retry_on_conflict => 3
    action => "index"
    
    # Performance tuning
    workers => 2
    flush_size => 100
    idle_flush_time => 1
    
    # Security
    user => "logstash_user"
    password => "${ELASTICSEARCH_PASSWORD}"
    ssl => true
    ssl_certificate_verification => true
    cacert => "/etc/logstash/certs/ca.crt"
  }

  # Separate output for error logs
  if "error" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "logs-errors-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][trace_id]}"
      user => "logstash_user"
      password => "${ELASTICSEARCH_PASSWORD}"
    }
  }

  # Separate output for audit logs (high retention)
  if "audit" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "logs-audit-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][trace_id]}"
      user => "logstash_user"
      password => "${ELASTICSEARCH_PASSWORD}"
    }
  }

  # CloudWatch output (backup)
  if [@metadata][index_type] == "infra-logs" {
    cloudwatch_logs {
      log_group_name => "/ehr-platform/infrastructure"
      log_stream_name => "%{host}-%{type}"
      region => "${AWS_REGION:us-east-1}"
    }
  }

  # Console output for debugging (dev only)
  if [@env] == "development" {
    stdout {
      codec => rubydebug
    }
  }

  # Metrics output (for monitoring)
  if [@metadata][index_type] == "metrics" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "metrics-%{+YYYY.MM.dd}"
    }
  }
}
