
    <div class="space-y-6 stagger">

      <!-- ── Page header ───────────────────────────── -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h1 class="heading-xl">Patients</h1>
          <p class="body-text mt-1">{{ patients.length }} patients registered</p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button class="btn-secondary btn-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
            </svg>
            Export
          </button>
          <a routerLink="/patients/new" class="btn-primary btn-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            New Patient
          </a>
        </div>
      </div>

      <!-- ── Search + filters ─────────────────────── -->
      <div class="flex flex-col sm:flex-row gap-3">
        <div class="relative flex-1">
          <div class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none">
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
          </div>
          <input
            type="text"
            placeholder="Search patients by name, MRN, or condition…"
            [value]="searchQuery()"
            (input)="setSearch($any($event.target).value)"
            class="input-icon w-full"
          />
        </div>
        <div class="flex items-center gap-2">
          <button *ngFor="let f of filters; trackBy: trackByValue"
            (click)="setFilter(f)"
            [class]="activeFilter() === f ? 'filter-pill-active' : 'filter-pill'">
            {{ f }}
          </button>
        </div>
      </div>

      <!-- ── Stats row ────────────────────────────── -->
      <div class="grid-3-stats">
        <div *ngFor="let s of summaryStats; trackBy: trackByLabel"
          class="card-green flex items-center gap-3.5 px-4 py-3.5 transition-transform duration-200 hover:-translate-y-0.5">
          <div [ngClass]="s.iconClass" class="icon-box-md shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" [attr.d]="s.icon"/>
            </svg>
          </div>
          <div class="min-w-0 flex-1">
            <p class="text-xl font-bold text-gray-900 dark:text-white tabular-nums leading-tight">{{ s.value }}</p>
            <p class="text-xs text-gray-600 dark:text-gray-300 font-medium truncate mt-0.5">{{ s.label }}</p>
          </div>
        </div>
      </div>

      <!-- ── Patient grid (subcomponent) ─────────── -->
      <app-patient-cards-grid [patients]="filteredPatients()"></app-patient-cards-grid>

    </div>
