
    <div class="card flex flex-col gap-5">
      <!-- Avatar block -->
      <div class="flex items-center gap-4">
        <div class="w-16 h-16 rounded-2xl flex items-center justify-center text-white text-xl font-bold shadow-md bg-gradient-to-br from-green-700 via-green-600 to-green-400">
          {{ patient.initials }}
        </div>
        <div>
          <p class="font-bold text-gray-900 dark:text-white text-base">{{ patient.name }}</p>
          <p class="text-xs text-gray-500 dark:text-gray-400">DOB: {{ patient.dob }}</p>
          <p class="text-xs text-gray-500 dark:text-gray-400">{{ patient.phone }}</p>
        </div>
      </div>
      <div class="divider"></div>
      <!-- Demographics -->
      <dl class="space-y-3">
        <div *ngFor="let d of demographics" class="flex items-start justify-between gap-2">
          <dt class="text-xs font-medium text-gray-400 dark:text-gray-500 shrink-0">{{ d.label }}</dt>
          <dd class="text-xs font-semibold text-gray-900 dark:text-white text-right">{{ d.value }}</dd>
        </div>
      </dl>
      <div class="divider"></div>
      <!-- Conditions -->
      <div>
        <p class="text-2xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Diagnoses</p>
        <div class="flex flex-wrap gap-1.5">
          <span *ngFor="let c of patient.conditions" class="badge-neutral text-2xs">{{ c }}</span>
        </div>
      </div>
      <div class="divider"></div>
      <!-- Allergies -->
      <div>
        <p class="text-2xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Allergies</p>
        <div class="flex flex-wrap gap-1.5">
          <span *ngFor="let a of patient.allergies" class="px-2 py-0.5 rounded-md text-xs font-semibold bg-red-50 dark:bg-red-950/40 text-red-700 dark:text-red-300 border border-red-200/60 dark:border-red-800/40">{{ a }}</span>
        </div>
      </div>
    </div>
