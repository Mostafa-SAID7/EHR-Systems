
    <div class="min-h-screen flex items-center justify-center bg-surface-50 dark:bg-surface-900 px-4 py-12 relative overflow-hidden">
      <!-- Ambient Glowing Gradients -->
      <div class="absolute -top-40 -left-40 w-96 h-96 bg-primary-500/15 rounded-full blur-3xl pointer-events-none animate-pulse-slow"></div>
      <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-teal-500/15 rounded-full blur-3xl pointer-events-none animate-pulse-slow"></div>

      <div class="relative z-10 max-w-lg w-full text-center stagger">
        <!-- Floating 404 Animated Header -->
        <div class="relative inline-block mb-6">
          <span class="text-8xl sm:text-9xl font-black text-transparent bg-clip-text bg-gradient-to-r from-primary-600 via-teal-500 to-primary-800 tracking-widest select-none drop-shadow-sm">
            404
          </span>
          <div class="absolute -top-2 -right-4 w-12 h-12 rounded-2xl bg-white dark:bg-surface-800 shadow-xl border border-surface-200 dark:border-surface-700 flex items-center justify-center text-primary-600 dark:text-primary-400 animate-bounce">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </div>
        </div>

        <!-- Headline & Description -->
        <h1 class="heading-xl text-gray-900 dark:text-white">
          Page Not Found
        </h1>
        <p class="body-text mt-3 text-sm max-w-md mx-auto leading-relaxed">
          The medical record, route, or destination you are looking for doesn't exist or has been moved to another location.
        </p>

        <!-- Quick Navigation Search Bar -->
        <div class="mt-8 relative max-w-md mx-auto">
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
            </div>
            <input
              type="text"
              [(ngModel)]="searchQuery"
              (keyup.enter)="onSearch()"
              placeholder="Search destination (e.g., Patients, Billing, Prescriptions)…"
              class="input-icon w-full py-3 text-xs shadow-sm bg-white dark:bg-surface-800"
            />
          </div>

          <!-- Quick Suggestions Pills -->
          <div class="flex flex-wrap items-center justify-center gap-2 mt-4">
            <span class="text-xs text-gray-400 dark:text-gray-500 font-medium">Quick Jump:</span>
            <a routerLink="/dashboard" class="px-3 py-1 rounded-full text-xs font-semibold bg-surface-200/60 dark:bg-surface-800 text-gray-700 dark:text-gray-300 hover:bg-primary-100 hover:text-primary-700 transition-colors">
              Dashboard
            </a>
            <a routerLink="/patients" class="px-3 py-1 rounded-full text-xs font-semibold bg-surface-200/60 dark:bg-surface-800 text-gray-700 dark:text-gray-300 hover:bg-primary-100 hover:text-primary-700 transition-colors">
              Patients
            </a>
            <a routerLink="/appointments" class="px-3 py-1 rounded-full text-xs font-semibold bg-surface-200/60 dark:bg-surface-800 text-gray-700 dark:text-gray-300 hover:bg-primary-100 hover:text-primary-700 transition-colors">
              Appointments
            </a>
            <a routerLink="/prescriptions" class="px-3 py-1 rounded-full text-xs font-semibold bg-surface-200/60 dark:bg-surface-800 text-gray-700 dark:text-gray-300 hover:bg-primary-100 hover:text-primary-700 transition-colors">
              Prescriptions
            </a>
          </div>
        </div>

        <!-- Action CTA Buttons -->
        <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3">
          <button (click)="goBack()" class="btn-secondary btn-sm w-full sm:w-auto px-6 py-3 flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
            Go Back
          </button>
          <a routerLink="/dashboard" class="btn-primary btn-sm w-full sm:w-auto px-6 py-3 flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            Return to Dashboard
          </a>
        </div>
      </div>
    </div>
