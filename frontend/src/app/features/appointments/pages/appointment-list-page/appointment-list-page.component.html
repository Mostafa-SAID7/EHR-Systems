
<div class="space-y-6 stagger">

  <!-- ── Header ───────────────────────────────── -->
  <div class="page-header">
    <div>
      <h1 class="heading-xl">Appointments</h1>
      <p class="body-text mt-1">{{ todayLabel }} — {{ (stats$ | async)?.scheduled || 0 }} appointments</p>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <div class="view-toggle">
        <button *ngFor="let v of views"
          (click)="activeView = v.key"
          [class]="activeView === v.key ? 'view-toggle-btn-active' : 'view-toggle-btn'">
          {{ v.label }}
        </button>
      </div>
      <a routerLink="/appointments/new" class="btn-primary btn-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        New
      </a>
    </div>
  </div>

  <!-- ── Day navigation ────────────────────────── -->
  <div class="flex items-center justify-between">
    <button class="btn-ghost btn-sm">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      Previous
    </button>
    <div class="flex items-center gap-2">
      <div class="icon-box-sm icon-box-primary">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
      </div>
      <span class="text-sm font-semibold text-gray-900 dark:text-white">{{ todayLabel }}</span>
    </div>
    <button class="btn-ghost btn-sm">
      Next
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
    </button>
  </div>

  <!-- ── Status summary pills ──────────────────── -->
  <div class="grid grid-cols-2 sm:grid-cols-5 gap-3" *ngIf="stats$ | async as stats">
    <div *ngFor="let s of statusSummary"
      class="mini-stat cursor-pointer hover:shadow-card-hover hover:-translate-y-0.5 transition-all duration-200">
      <div class="w-2.5 h-2.5 rounded-full shrink-0" [ngClass]="s.dotClass"></div>
      <div>
        <p class="text-base font-bold text-gray-900 dark:text-white tabular-nums">{{ getStatusCount(s.status, stats) }}</p>
        <p class="text-2xs text-gray-500 dark:text-gray-400 font-medium">{{ s.label }}</p>
      </div>
    </div>
  </div>

  <!-- ── Loading state ──────────────────────── -->
  <div *ngIf="(loading$ | async)" class="card p-8 text-center">
    <p class="text-gray-500">Loading appointments...</p>
  </div>

  <!-- ── Error state ───────────────────────── -->
  <div *ngIf="(error$ | async) as error" class="card bg-red-50 dark:bg-red-950/30 border border-red-200 dark:border-red-800">
    <p class="text-sm text-red-700 dark:text-red-300">{{ error }}</p>
  </div>

  <!-- ── Schedule table (subcomponent) ───────── -->
  <div *ngIf="!(loading$ | async)">
    <app-appointment-schedule-table 
      [appointments]="(rows$ | async) || []"
      *ngIf="(rows$ | async)?.length; else emptyState">
    </app-appointment-schedule-table>
    
    <ng-template #emptyState>
      <div class="card p-8 text-center">
        <p class="text-gray-500">No appointments scheduled</p>
      </div>
    </ng-template>
  </div>

</div>
