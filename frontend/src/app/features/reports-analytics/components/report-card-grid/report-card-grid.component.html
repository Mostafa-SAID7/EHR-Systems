
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
      <div *ngFor="let r of reports" class="card-hover group flex flex-col">
        <!-- Icon + category -->
        <div class="flex items-start justify-between mb-4">
          <div [ngClass]="r.iconClass" class="icon-box-lg">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" [attr.d]="r.icon"/>
            </svg>
          </div>
          <span class="badge-neutral text-2xs">{{ r.category }}</span>
        </div>

        <!-- Content -->
        <h3 class="text-sm font-bold text-gray-900 dark:text-white mb-1.5">{{ r.title }}</h3>
        <p class="text-xs text-gray-500 dark:text-gray-400 leading-relaxed flex-1">{{ r.description }}</p>

        <!-- Metadata -->
        <div class="mt-4 pt-3 border-t border-surface-100 dark:border-surface-700/50">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-2xs text-gray-400">Last generated</p>
              <p class="text-xs font-semibold text-gray-700 dark:text-gray-300">{{ r.lastRun }}</p>
            </div>
            <div class="flex items-center gap-1">
              <button (click)="generate.emit(r)" class="btn-primary btn-sm">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                Run
              </button>
              <button class="btn-icon-sm" title="Download last report">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
