
    <div class="space-y-6 stagger">

      <!-- ── Header ───────────────────────────────────── -->
      <div class="page-header">
        <div>
          <h1 class="heading-xl">Reports &amp; Analytics</h1>
          <p class="body-text mt-1">Generate, schedule, and export clinical and operational reports</p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button class="btn-secondary btn-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            Schedule Report
          </button>
          <button class="btn-primary btn-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            New Report
          </button>
        </div>
      </div>

      <!-- ── Summary Stats Subcomponent ─────────────────── -->
      <app-report-stats-grid
        [stats]="stats"
      ></app-report-stats-grid>

      <!-- ── Category Filter ──────────────────────────── -->
      <div class="filter-bar">
        <button *ngFor="let cat of categories"
          (click)="activeCategory = cat"
          [class]="activeCategory === cat ? 'filter-pill-active' : 'filter-pill'">
          {{ cat }}
        </button>
      </div>

      <!-- ── Report Library Grid Subcomponent ────────────── -->
      <app-report-card-grid
        [reports]="filteredReports()"
        (generate)="generateReport($event)"
      ></app-report-card-grid>

      <!-- ── Recent Report Runs ────────────────────────── -->
      <div class="card p-0 overflow-hidden">
        <div class="card-header">
          <h2 class="heading-sm">Recent Report Runs</h2>
          <span class="badge-primary">{{ recentRuns.length }} runs today</span>
        </div>
        <div class="divide-y divide-surface-100 dark:divide-surface-700/50">
          <div *ngFor="let run of recentRuns"
            class="flex items-center justify-between px-5 py-3.5 hover:bg-primary-50/30 dark:hover:bg-primary-900/10 transition-colors">
            <div class="flex items-center gap-3 min-w-0">
              <div [ngClass]="run.iconClass" class="icon-box-sm shrink-0">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" [attr.d]="run.icon"/>
                </svg>
              </div>
              <div class="min-w-0">
                <p class="text-sm font-semibold text-gray-900 dark:text-white truncate">{{ run.title }}</p>
                <p class="text-2xs text-gray-400">Generated by {{ run.user }} &middot; {{ run.time }}</p>
              </div>
            </div>
            <div class="flex items-center gap-3 shrink-0">
              <span class="badge-neutral text-2xs">{{ run.format }}</span>
              <button class="btn-icon-sm" title="Download">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- ── Toast ─────────────────────────────────────── -->
      <div *ngIf="generating"
        class="fixed bottom-6 right-6 flex items-center gap-3 px-5 py-3.5 rounded-2xl bg-surface-900 dark:bg-white text-white dark:text-gray-900 text-sm font-semibold shadow-2xl z-50 animate-fade-in">
        <svg class="w-4 h-4 text-primary-400 dark:text-primary-600 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        Generating report…
      </div>

    </div>
