
    <div *ngIf="show" class="card bg-primary-50/60 dark:bg-primary-950/30 border border-primary-200/60 dark:border-primary-800/40 space-y-4">
      <h2 class="heading-sm">Invite New User</h2>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1.5">Full Name *</label>
          <input type="text" [(ngModel)]="invite.name" placeholder="Dr. Jane Smith" class="input-base w-full"/>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1.5">Email *</label>
          <input type="email" [(ngModel)]="invite.email" placeholder="jane@hospital.com" class="input-base w-full"/>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1.5">Role *</label>
          <select [(ngModel)]="invite.role" class="input-base w-full">
            <option value="">— Select role —</option>
            <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
          </select>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button (click)="send.emit()" class="btn-primary btn-sm">Send Invitation</button>
        <button (click)="close.emit()" class="btn-ghost btn-sm">Cancel</button>
        <span *ngIf="inviteSent" class="text-sm font-semibold text-primary-600 dark:text-primary-400">✓ Invitation sent!</span>
      </div>
    </div>
