
    <div class="space-y-6 stagger">

      <!-- ── Header ───────────────────────────────────── -->
      <div class="page-header">
        <div>
          <h1 class="heading-xl">User Management</h1>
          <p class="body-text mt-1">Manage platform users, roles, and access permissions</p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button class="btn-secondary btn-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
            </svg>
            Export
          </button>
          <button (click)="showInvite = !showInvite" class="btn-primary btn-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
            </svg>
            Invite User
          </button>
        </div>
      </div>

      <!-- ── Stats Subcomponent ────────────────────────── -->
      <app-admin-user-stats-strip
        [stats]="stats"
      ></app-admin-user-stats-strip>

      <!-- ── Invite Panel Subcomponent ─────────────────── -->
      <app-admin-user-invite-panel
        [show]="showInvite"
        [invite]="invite"
        [roles]="roles"
        [inviteSent]="inviteSent"
        (send)="sendInvite()"
        (close)="showInvite = false"
      ></app-admin-user-invite-panel>

      <!-- ── Search + filter ───────────────────────────── -->
      <div class="search-row">
        <div class="relative flex-1">
          <div class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none">
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
          </div>
          <input type="text" [(ngModel)]="searchQuery" (input)="loadUsers()" placeholder="Search users by name or email…" class="input-icon w-full"/>
        </div>
        <div class="filter-bar">
          <button *ngFor="let f of filters"
            (click)="activeFilter = f"
            [class]="activeFilter === f ? 'filter-pill-active' : 'filter-pill'">
            {{ f }}
          </button>
        </div>
      </div>

      <!-- ── User table ────────────────────────────────── -->
      <div class="card overflow-hidden">
        <div class="overflow-x-auto">
          <table class="table-base">
            <thead>
              <tr>
                <th>User</th>
                <th>Role</th>
                <th>Department</th>
                <th>Status</th>
                <th>Last Active</th>
                <th class="text-right">Actions</th>
              </tr>
            </thead>
            <tbody>
              <!-- Loading Skeleton Rows -->
              <ng-container *ngIf="isLoading">
                <app-skeleton shape="table-row"></app-skeleton>
                <app-skeleton shape="table-row"></app-skeleton>
                <app-skeleton shape="table-row"></app-skeleton>
                <app-skeleton shape="table-row"></app-skeleton>
              </ng-container>

              <ng-container *ngIf="!isLoading">
                <tr *ngFor="let user of filteredUsers()">

                <td>
                  <div class="flex items-center gap-3">
                    <div class="avatar-custom-md" [style.background]="user.color">{{ user.initials }}</div>
                    <div>
                      <p class="label-text">{{ user.name }}</p>
                      <p class="caption">{{ user.email }}</p>
                    </div>
                  </div>
                </td>
                <td>
                  <span class="badge-primary badge">{{ user.role }}</span>
                </td>
                <td class="body-text">{{ user.department }}</td>
                <td>
                  <span class="badge"
                        [ngClass]="user.active ? 'badge-success' : 'badge-danger'">
                    <span class="w-1.5 h-1.5 rounded-full"
                          [ngClass]="user.active ? 'bg-green-500' : 'bg-red-500'"></span>
                    {{ user.active ? 'Active' : 'Inactive' }}
                  </span>
                </td>
                <td class="caption">{{ user.lastActive }}</td>
                <td class="text-right">
                  <div class="flex items-center justify-end gap-1">
                    <button class="btn-icon-sm" title="Edit user">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                      </svg>
                    </button>
                    <button (click)="deactivateUser(user.id)" class="btn-icon-sm text-red-500 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20" title="Deactivate">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
                      </svg>
                    </button>
                  </div>
                </td>
              </tr>
              </ng-container>
            </tbody>
          </table>
        </div>
      </div>

    </div>
