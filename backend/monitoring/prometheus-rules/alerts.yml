groups:
  - name: ehr_platform_alerts
    interval: 30s
    rules:
      # ─────────────────────────────────────────────────────────────────────
      # Service Availability Alerts
      # ─────────────────────────────────────────────────────────────────────

      - alert: ServiceDown
        expr: up{job=~"ehr-.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "{{ $labels.job }} has been unreachable for more than 2 minutes"

      - alert: ServiceSlowResponse
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow response time in {{ $labels.service }}"
          description: "P95 latency is {{ $value }}s, threshold is 1s"

      # ─────────────────────────────────────────────────────────────────────
      # Error Rate Alerts
      # ─────────────────────────────────────────────────────────────────────

      - alert: HighErrorRate
        expr: (rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate in {{ $labels.service }}"
          description: "Error rate is {{ $value | humanizePercentage }}, threshold is 5%"

      - alert: CriticalErrorRate
        expr: (rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m])) > 0.10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical error rate in {{ $labels.service }}"
          description: "Error rate is {{ $value | humanizePercentage }}, threshold is 10%"

      # ─────────────────────────────────────────────────────────────────────
      # Database Alerts
      # ─────────────────────────────────────────────────────────────────────

      - alert: PostgreSQLConnectionHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection pool approaching limit"
          description: "Current connections: {{ $value }}, threshold: 80"

      - alert: PostgreSQLDown
        expr: up{job="postgresql"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL database is unreachable"

      # ─────────────────────────────────────────────────────────────────────
      # Redis Alerts
      # ─────────────────────────────────────────────────────────────────────

      - alert: RedisMemoryHigh
        expr: (redis_used_memory / redis_maxmemory) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis memory usage: {{ $value | humanizePercentage }}, threshold: 85%"

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis cache is unreachable"

      - alert: RedisEvictions
        expr: rate(redis_evicted_keys_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Redis is evicting keys due to memory pressure"
          description: "Eviction rate: {{ $value }} keys/sec"

      # ─────────────────────────────────────────────────────────────────────
      # Elasticsearch Alerts
      # ─────────────────────────────────────────────────────────────────────

      - alert: ElasticsearchClusterUnhealthy
        expr: elasticsearch_cluster_health_status != 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Elasticsearch cluster is not healthy"
          description: "Cluster health status: {{ $value }}"

      - alert: ElasticsearchDown
        expr: up{job="elasticsearch"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Elasticsearch is down"
          description: "Elasticsearch search engine is unreachable"

      # ─────────────────────────────────────────────────────────────────────
      # Kafka Alerts
      # ─────────────────────────────────────────────────────────────────────

      - alert: KafkaDown
        expr: up{job="kafka"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kafka broker is down"
          description: "Kafka broker is unreachable"

      - alert: KafkaUnderReplicatedPartitions
        expr: kafka_topic_partitions_under_replicated > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka has under-replicated partitions"
          description: "Number of under-replicated partitions: {{ $value }}"

      # ─────────────────────────────────────────────────────────────────────
      # Business Logic Alerts
      # ─────────────────────────────────────────────────────────────────────

      - alert: OutboxProcessorBacklog
        expr: ehr_outbox_events_unpublished > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Outbox processor has a backlog of events"
          description: "Unpublished events: {{ $value }}"

      - alert: OutboxPublishFailures
        expr: rate(ehr_outbox_publish_failures_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox processor publish failures detected"
          description: "Failure rate: {{ $value }} failures/sec"

      # ─────────────────────────────────────────────────────────────────────
      # Resource Alerts
      # ─────────────────────────────────────────────────────────────────────

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk space is low"
          description: "Available disk space: {{ $value | humanizePercentage }}, threshold: 10%"

      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space is critical"
          description: "Available disk space: {{ $value | humanizePercentage }}, threshold: 5%"

      # ─────────────────────────────────────────────────────────────────────
      # Request Volume Alerts
      # ─────────────────────────────────────────────────────────────────────

      - alert: NoRequests
        expr: rate(http_requests_total[5m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No requests detected for {{ $labels.service }}"
          description: "Service appears to be idle"

      - alert: RequestSpike
        expr: rate(http_requests_total[5m]) > 1000
        for: 2m
        labels:
          severity: info
        annotations:
          summary: "Request spike detected in {{ $labels.service }}"
          description: "Current rate: {{ $value }} req/sec"
