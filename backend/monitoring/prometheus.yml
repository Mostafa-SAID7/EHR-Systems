global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'ehr-platform'
    environment: 'development'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - 'alertmanager:9093'

# Load rules once and periodically evaluate them
rule_files:
  - '/etc/prometheus/rules/alerts.yml'

scrape_configs:
  # ─────────────────────────────────────────────────────────────────────────
  # Prometheus itself
  # ─────────────────────────────────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ─────────────────────────────────────────────────────────────────────────
  # EHR Platform Services (via HTTP /metrics endpoint)
  # ─────────────────────────────────────────────────────────────────────────

  - job_name: 'ehr-api-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-gateway:5000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'api-gateway'

  - job_name: 'ehr-identity-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['identity-service:5001']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'identity'

  - job_name: 'ehr-patient-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['patient-service:5002']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'patient'

  - job_name: 'ehr-clinical-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['clinical-service:5003']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'clinical'

  - job_name: 'ehr-appointment-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['appointment-service:5004']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'appointment'

  - job_name: 'ehr-notification-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['notification-service:5005']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'notification'

  - job_name: 'ehr-audit-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['audit-service:5006']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'audit'

  - job_name: 'ehr-billing-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['billing-service:5007']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'billing'

  - job_name: 'ehr-prescription-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['prescription-service:5008']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'prescription'

  - job_name: 'ehr-analytics-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['analytics-service:5009']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'analytics'

  - job_name: 'ehr-outbox-processor'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['outbox-processor:9000']  # Adjust port if different
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'outbox-processor'

  # ─────────────────────────────────────────────────────────────────────────
  # Infrastructure Services
  # ─────────────────────────────────────────────────────────────────────────

  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres:5432']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'postgres'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'redis'

  - job_name: 'elasticsearch'
    metrics_path: '/_prometheus/metrics'
    static_configs:
      - targets: ['elasticsearch:9200']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'elasticsearch'

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'kafka'
