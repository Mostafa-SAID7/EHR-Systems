# ─────────────────────────────────────────────────────────────────────────────
# Docker Compose Override - Local Development
# ─────────────────────────────────────────────────────────────────────────────
# This file is auto-loaded by 'docker-compose up' and overrides production
# settings for local development (increased logging, relaxed constraints, etc).
#
# Use: docker-compose up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─────────────────────────────────────────────────────────────────────────
  # INFRASTRUCTURE - Dev Overrides
  # ─────────────────────────────────────────────────────────────────────────

  postgres:
    environment:
      POSTGRES_INITDB_ARGS: "-c log_statement=all -c log_duration=on"
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 3

  redis:
    command: redis-server --requirepass redis_password --maxmemory 256mb --maxmemory-policy allkeys-lru --loglevel debug
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 3

  elasticsearch:
    environment:
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
      - logger.level=WARN
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 3

  # ─────────────────────────────────────────────────────────────────────────
  # API Gateway - Dev Overrides
  # ─────────────────────────────────────────────────────────────────────────

  api-gateway:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft: Warning
      Logging__LogLevel__Yarp: Debug
    ports:
      - "5000:5000"
    networks:
      - ehr-network

  # ─────────────────────────────────────────────────────────────────────────
  # Microservices - Dev Overrides (verbose logging, fast startup)
  # ─────────────────────────────────────────────────────────────────────────

  identity-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft: Warning

  patient-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft: Warning

  clinical-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft: Warning

  appointment-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft: Warning

  notification-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft: Warning

  audit-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft: Warning

  billing-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft: Warning

  prescription-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft: Warning

  analytics-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft: Warning

