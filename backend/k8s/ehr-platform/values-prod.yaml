# Production environment overrides
global:
  environment: production
  imagePullPolicy: IfNotPresent
  imageRegistry: myregistry.azurecr.io  # ← Use your prod registry

apiGateway:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

services:
  identity:
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 6

  patient:
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10

  clinical:
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6

  appointment:
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10

  notification:
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5

  audit:
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4

  billing:
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6

  prescription:
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5

  analytics:
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 8

infrastructure:
  postgresql:
    resources:
      requests:
        cpu: 1000m
        memory: 2Gi
      limits:
        cpu: 4000m
        memory: 8Gi
    persistence:
      size: 100Gi
      storageClass: fast-ssd
  
  redis:
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    persistence:
      size: 50Gi
      storageClass: fast-ssd
    env:
      - name: maxmemory
        value: "4gb"
  
  elasticsearch:
    replicaCount: 3
    resources:
      requests:
        cpu: 1000m
        memory: 4Gi
      limits:
        cpu: 4000m
        memory: 8Gi
    persistence:
      size: 100Gi
      storageClass: fast-ssd

resourceQuota:
  requests:
    cpu: "20"
    memory: "40Gi"
  limits:
    cpu: "40"
    memory: "80Gi"

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.ehr-platform.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ehr-platform-tls-prod
      hosts:
        - api.ehr-platform.com

networkPolicy:
  enabled: true

monitoring:
  enabled: true
  prometheus:
    enabled: true
    retention: 30d
  grafana:
    enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

secrets:
  # ⚠️  USE EXTERNAL SECRETS OPERATOR IN PRODUCTION
  # Do not commit actual secrets to git!
  jwtSecret: "REPLACE_WITH_SECURE_SECRET_IN_VAULT"
  postgresPassword: "REPLACE_WITH_SECURE_PASSWORD_IN_VAULT"
  redisPassword: "REPLACE_WITH_SECURE_PASSWORD_IN_VAULT"
