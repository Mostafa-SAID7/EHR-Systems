---
apiVersion: v1
kind: Secret
metadata:
  name: ehr-jwt-secret
  namespace: {{ .Values.namespace.name }}
type: Opaque
stringData:
  secret: {{ .Values.secrets.jwtSecret | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: ehr-database-secret
  namespace: {{ .Values.namespace.name }}
type: Opaque
stringData:
  password: {{ .Values.secrets.postgresPassword | quote }}
  connection-string: |
    Host=postgresql;Port={{ .Values.infrastructure.postgresql.port }};Database={{ .Values.infrastructure.postgresql.env.POSTGRES_DB }};Username={{ .Values.infrastructure.postgresql.env.POSTGRES_USER }};Password={{ .Values.secrets.postgresPassword }};Include Error Detail=true

---
apiVersion: v1
kind: Secret
metadata:
  name: ehr-redis-secret
  namespace: {{ .Values.namespace.name }}
type: Opaque
stringData:
  password: {{ .Values.secrets.redisPassword | quote }}
  connection-string: "redis://default:{{ .Values.secrets.redisPassword }}@redis:{{ .Values.infrastructure.redis.port }}"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ehr-config
  namespace: {{ .Values.namespace.name }}
data:
  jwt-issuer: {{ .Values.config.jwtIssuer | quote }}
  jwt-audience: {{ .Values.config.jwtAudience | quote }}
  jwt-expiration-minutes: {{ .Values.config.jwtExpirationMinutes | quote }}
  environment: {{ .Values.global.environment | quote }}
  domain: {{ .Values.global.domain | quote }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ehr-logging
  namespace: {{ .Values.namespace.name }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft": "Warning",
          "Microsoft.AspNetCore": "Warning",
          "Yarp": "Information"
        },
        "Console": {
          "IncludeScopes": true
        }
      }
    }
