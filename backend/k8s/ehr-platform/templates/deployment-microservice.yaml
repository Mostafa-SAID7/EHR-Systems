{{- $services := dict "identity" .Values.services.identity "patient" .Values.services.patient "clinical" .Values.services.clinical "appointment" .Values.services.appointment "notification" .Values.services.notification "audit" .Values.services.audit "billing" .Values.services.billing "prescription" .Values.services.prescription "analytics" .Values.services.analytics }}
{{- range $serviceName, $service := $services }}
{{- if $service.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $service.name }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    app: {{ $service.name }}
    version: v1
    service-type: microservice
spec:
  replicas: {{ $service.replicaCount }}
  selector:
    matchLabels:
      app: {{ $service.name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ $service.name }}
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $service.port }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ $.Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      
      containers:
      - name: {{ $service.name }}
        image: "{{ $.Values.global.imageRegistry }}/{{ $service.image }}"
        imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
        ports:
        - name: http
          containerPort: {{ $service.port }}
          protocol: TCP
        
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: {{ $.Values.global.environment | quote }}
        - name: ASPNETCORE_URLS
          value: "http://+:{{ $service.port }}"
        - name: Logging__LogLevel__Default
          value: "Information"
        - name: ConnectionStrings__Postgres
          valueFrom:
            secretKeyRef:
              name: ehr-database-secret
              key: connection-string
        - name: ConnectionStrings__Redis
          valueFrom:
            secretKeyRef:
              name: ehr-redis-secret
              key: connection-string
        {{- if or (eq $serviceName "patient") (eq $serviceName "appointment") (eq $serviceName "billing") (eq $serviceName "analytics") }}
        - name: Elasticsearch__Urls
          value: "http://elasticsearch:9200"
        {{- end }}
        - name: Jwt__Secret
          valueFrom:
            secretKeyRef:
              name: ehr-jwt-secret
              key: secret
        - name: Jwt__Issuer
          value: {{ $.Values.config.jwtIssuer | quote }}
        - name: Jwt__Audience
          value: {{ $.Values.config.jwtAudience | quote }}
        
        resources:
          requests:
            cpu: {{ $service.resources.requests.cpu }}
            memory: {{ $service.resources.requests.memory }}
          limits:
            cpu: {{ $service.resources.limits.cpu }}
            memory: {{ $service.resources.limits.memory }}
        
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - {{ $service.name }}
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $service.name }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    app: {{ $service.name }}
spec:
  type: ClusterIP
  ports:
  - port: {{ $service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: {{ $service.name }}

{{- if $service.autoscaling }}
{{- if $service.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $service.name }}-hpa
  namespace: {{ $.Values.namespace.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $service.name }}
  minReplicas: {{ $service.autoscaling.minReplicas }}
  maxReplicas: {{ $service.autoscaling.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
{{- end }}
{{- end }}
{{- end }}
{{- end }}
