# ─────────────────────────────────────────────────────────────────────────────
# EHR Platform - Full Microservices Stack with Infrastructure
# ─────────────────────────────────────────────────────────────────────────────
# Services:
#   - API Gateway (YARP): 5000
#   - Identity: 5001
#   - Patient: 5002
#   - Clinical: 5003
#   - Appointment: 5004
#   - Notification: 5005
#   - Audit: 5006
#   - Billing: 5007
#   - Prescription: 5008
#   - Analytics: 5009
#
# Infrastructure:
#   - PostgreSQL: 5432 (database for all services)
#   - Redis: 6379 (distributed caching)
#   - Elasticsearch: 9200 (search indexing)
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ─────────────────────────────────────────────────────────────────────────
  # INFRASTRUCTURE LAYER
  # ─────────────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: ehr-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ehr_platform}
      POSTGRES_USER: ${POSTGRES_USER:-ehr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ehr_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ehr_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ehr-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ehr-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password} --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ehr-network
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: ehr-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=${ES_SECURITY_ENABLED:-false}
      - xpack.security.enrollment.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\\\"status\\\":\\\"yellow\\\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ehr-network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # MESSAGE BUS - Kafka with Zookeeper
  # ─────────────────────────────────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ehr-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_INIT_LIMIT: 10
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ehr-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ehr-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_NETWORK_THREADS: 8
      KAFKA_NUM_IO_THREADS: 8
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ehr-network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # MONITORING - Prometheus & Grafana
  # ─────────────────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: ehr-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus-rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    environment:
      TZ: UTC
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ehr-network
    restart: unless-stopped
    depends_on:
      - api-gateway

  grafana:
    image: grafana/grafana:latest
    container_name: ehr-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ehr-network
    restart: unless-stopped
    depends_on:
      - prometheus

  # ─────────────────────────────────────────────────────────────────────────
  # API GATEWAY (Entry Point)
  # ─────────────────────────────────────────────────────────────────────────

  api-gateway:
    build:
      context: .
      dockerfile: ./src/EHRPlatform.Services.ApiGateway/Dockerfile
    container_name: ehr-api-gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity-service:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-ehr_platform};Username=${POSTGRES_USER:-ehr_user};Password=${POSTGRES_PASSWORD:-ehr_password};Include Error Detail=true"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD:-redis_password}"
      Jwt__Secret: ${JWT_SECRET:-your-super-secret-key-change-in-production-at-least-32-characters-long!}
      Jwt__Issuer: ${JWT_ISSUER:-ehr-platform}
      Jwt__Audience: ${JWT_AUDIENCE:-ehr-api}
      OpenTelemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
    ports:
      - "5000:5000"
    networks:
      - ehr-network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # MICROSERVICES (7 services)
  # ─────────────────────────────────────────────────────────────────────────

  identity-service:
    build:
      context: .
      dockerfile: ./src/EHRPlatform.Services.Identity/Dockerfile
    container_name: ehr-identity-service
    depends_on:
      postgres:
