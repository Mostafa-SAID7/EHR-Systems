  # ─────────────────────────────────────────────────────────────────────────
  # OUTBOX PROCESSOR (Background Worker)
  # ─────────────────────────────────────────────────────────────────────────

  outbox-processor:
    build:
      context: .
      dockerfile: ./src/EHRPlatform.Services.OutboxProcessor/Dockerfile
    container_name: ehr-outbox-processor
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-ehr_platform};Username=${POSTGRES_USER:-ehr_user};Password=${POSTGRES_PASSWORD:-ehr_password};Include Error Detail=true"
      Kafka__BootstrapServers: kafka:9092
      Kafka__Topics__PatientEvents: patient-events
      Kafka__Topics__AppointmentEvents: appointment-events
      Kafka__Topics__BillingEvents: billing-events
      Kafka__Topics__AnalyticsEvents: analytics-events
      Kafka__Topics__AuditEvents: audit-events
      Kafka__Topics__NotificationEvents: notification-events
      OutboxProcessor__PollIntervalMs: 5000
      OutboxProcessor__BatchSize: 100
      OutboxProcessor__MaxRetries: 3
      OutboxProcessor__RetryDelayMs: 1000
    networks:
      - ehr-network
    restart: unless-stopped

# ─────────────────────────────────────────────────────────────────────────────
# NETWORKS & VOLUMES
# ─────────────────────────────────────────────────────────────────────────────

networks:
  ehr-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  kafka_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

