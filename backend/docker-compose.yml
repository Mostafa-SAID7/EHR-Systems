      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-ehr_platform};Username=${POSTGRES_USER:-ehr_user};Password=${POSTGRES_PASSWORD:-ehr_password};Include Error Detail=true"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD:-redis_password}"
      Jwt__Secret: ${JWT_SECRET:-your-super-secret-key-change-in-production-at-least-32-characters-long!}
      Jwt__Issuer: ${JWT_ISSUER:-ehr-platform}
      Jwt__Audience: ${JWT_AUDIENCE:-ehr-api}
    ports:
      - "5001:5001"
    networks:
      - ehr-network
    restart: unless-stopped

  patient-service:
