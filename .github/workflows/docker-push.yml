name: Docker - Build & Push

on:
  push:
    branches:
      - main
    paths:
      - 'backend/src/**'
      - 'backend/**/*.sln'
      - 'backend/**/*.csproj'
      - '.github/workflows/docker-push.yml'
  workflow_dispatch:  # Manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # BUILD & PUSH DOCKER IMAGES
  # ─────────────────────────────────────────────────────────────────────────

  build-and-push:
    name: Build & Push - ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        service:
          - { name: "Identity", dir: "Identity", port: "5001" }
          - { name: "Patient", dir: "Patient", port: "5002" }
          - { name: "Clinical", dir: "Clinical", port: "5003" }
          - { name: "Appointment", dir: "Appointment", port: "5004" }
          - { name: "Notification", dir: "Notification", port: "5005" }
          - { name: "Audit", dir: "Audit", port: "5006" }
          - { name: "Billing", dir: "Billing", port: "5007" }
          - { name: "Prescription", dir: "Prescription", port: "5008" }
          - { name: "Analytics", dir: "Analytics", port: "5009" }
          - { name: "ApiGateway", dir: "ApiGateway", port: "5000" }
          - { name: "OutboxProcessor", dir: "OutboxProcessor", port: "N/A" }
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service.name }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          latest
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: backend/
        file: backend/src/EHRPlatform.Services.${{ matrix.service.dir }}/Dockerfile
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service.name }}:buildcache
        cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service.name }}:buildcache,mode=max
    
    - name: Image pushed
      run: |
        echo "🐳 ${{ matrix.service.name }} image pushed to ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service.name }}"
        echo "Tags: ${{ steps.meta.outputs.tags }}"

  # ─────────────────────────────────────────────────────────────────────────
  # SCAN IMAGES FOR VULNERABILITIES
  # ─────────────────────────────────────────────────────────────────────────

  scan-images:
    name: Scan Images - ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
    
    strategy:
      matrix:
        service:
          - { name: "Identity" }
          - { name: "Patient" }
          - { name: "Clinical" }
          - { name: "Appointment" }
          - { name: "Notification" }
          - { name: "Audit" }
          - { name: "Billing" }
          - { name: "Prescription" }
          - { name: "Analytics" }
          - { name: "ApiGateway" }
          - { name: "OutboxProcessor" }
    
    steps:
    - name: Scan image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service.name }}:latest
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy-${{ matrix.service.name }}'
