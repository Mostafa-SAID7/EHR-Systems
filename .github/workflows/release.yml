name: Release - Create & Publish

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # CREATE GITHUB RELEASE
  # ─────────────────────────────────────────────────────────────────────────

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for changelog
    
    - name: Generate changelog
      id: changelog
      run: |
        VERSION=${{ github.ref_name }}
        PREV_TAG=$(git describe --tags --abbrev=0 $VERSION^ 2>/dev/null || echo "HEAD")
        CHANGELOG=$(git log --oneline $PREV_TAG..$VERSION)
        
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: EHR Platform ${{ steps.changelog.outputs.version }}
        body: |
          # EHR Platform Release ${{ steps.changelog.outputs.version }}
          
          ## Changes
          ${{ steps.changelog.outputs.changelog }}
          
          ## Docker Images
          All service images available at: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}`
          
          Tagged as: `${{ github.ref_name }}`
          
          ## Deployment
          ```bash
          helm install ehr ./k8s/ehr-platform \
            -f k8s/ehr-platform/values-prod.yaml \
            --set global.imageTag=${{ github.ref_name }}
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────
  # BUILD & PUSH VERSIONED IMAGES
  # ─────────────────────────────────────────────────────────────────────────

  build-release-images:
    name: Build Release Images - ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        service:
          - Identity
          - Patient
          - Clinical
          - Appointment
          - Notification
          - Audit
          - Billing
          - Prescription
          - Analytics
          - ApiGateway
          - OutboxProcessor
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha
          latest
    
    - name: Build and push release image
      uses: docker/build-push-action@v5
      with:
        context: backend/
        file: backend/src/EHRPlatform.Services.${{ matrix.service }}/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
