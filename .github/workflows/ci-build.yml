name: CI - Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [
          'services/Identity/src/Identity.API',
          'services/Patient/src/Patient.API',
          'services/Appointment/src/Appointment.API',
          'services/Integration/src/Integration.API',
          'services/Terminology/src/Terminology.API',
          'services/FileStorage/src/FileStorage.API',
          'services/AI/src/AI.API',
          'gateway/ApiGateway/src/ApiGateway.API',
          'gateway/BFF/src/BFF.API'
        ]

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore EHR-System/${{ matrix.service }}/${{ matrix.service }}.csproj
      continue-on-error: true

    - name: Build
      run: dotnet build EHR-System/${{ matrix.service }}/${{ matrix.service }}.csproj -c Release --no-restore
      continue-on-error: true

    - name: Run tests
      run: dotnet test EHR-System/${{ matrix.service }}/../../tests/ -c Release --no-build --verbosity normal
      continue-on-error: true

    - name: Generate test report
      run: |
        dotnet tool install -g JunitXmlReporter
        dotnet test EHR-System/${{ matrix.service }}/../../tests/ -c Release --logger "junit;LogFilePath=./test-results.xml"
      continue-on-error: true

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.service }}
        path: test-results.xml
